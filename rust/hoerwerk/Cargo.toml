[package]
name = "hoerwerk"
version = "8.0.0-dev"
description = "Hörwerk backend in Rust – same API (contract/), same database, same frontend"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "process", "io-util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.9"
regex-lite = "0.1"
percent-encoding = "2"
mime_guess = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
bytes = "1"
unicode-normalization = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip", "json"] }
libc = "0.2"
fancy-regex = "0.16"
roxmltree = "0.21"
hw-tags = { path = "../hw-tags", version = "1.0.0" }

# Hörwerk in Rust – one workspace: hw-run (the ffmpeg jail) and, step by step, the backend.
[workspace]
resolver = "3"
members = ["hw-run", "hw-tags", "hoerwerk"]

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
rust-version = "1.90"

[profile.release]
lto = true
codegen-units = 1
# a panic ends the one request or thread, not the server – and lands in the log (see log_panics in main.rs)
panic = "unwind"
strip = true

# cargo-deny: what the Rust code may depend on (CI: cargo deny check).
[graph]
all-features = true

[advisories]
# every known vulnerability or unmaintained crate fails the build; exceptions only here, each with a reason
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0",
         # Mozilla's list of certificate authorities (webpki-root-certs, fallback of the system certificate check)
         "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

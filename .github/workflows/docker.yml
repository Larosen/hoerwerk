name: Test & Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # weekly rebuild: fresh Debian/ffmpeg security updates

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # system ffmpeg: creates the test audio files (our build has no MP3 encoder); nasm: for our build
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg nasm
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build our minimal FFmpeg (same version, commit and script as the image)
        run: |
          V=$(sed -n 's/^ARG FFMPEG_VERSION=//p' Dockerfile)
          C=$(sed -n 's/^ARG FFMPEG_COMMIT=//p' Dockerfile)
          git clone --quiet --depth 1 --branch "n$V" https://github.com/FFmpeg/FFmpeg.git "$RUNNER_TEMP/ffsrc"
          test "$(git -C "$RUNNER_TEMP/ffsrc" rev-parse HEAD)" = "$C"
          sh docker/build-ffmpeg.sh "$RUNNER_TEMP/ffsrc" "$RUNNER_TEMP/ffmpeg"
      - name: Tests with our FFmpeg inside the Landlock jail
        run: |
          python -c "import sys; sys.path.insert(0, 'app'); import sandbox; print(sandbox.status())"
          FFMPEG="$RUNNER_TEMP/ffmpeg/bin/ffmpeg" FFPROBE="$RUNNER_TEMP/ffmpeg/bin/ffprobe" FFMPEG_SANDBOX=require \
            python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: TypeScript (strict, no implicit any)
        run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Click-through tests (real server, real ffmpeg)
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The image as shipped (own ffmpeg, compiled UI) – started with the Unraid template's rights
  # and clicked through with the same tests.
  image-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hoerwerk:ci
          # own cache scope: this amd64-only build must not overwrite the multi-arch cache of the image job –
          # otherwise every release compiles FFmpeg for arm64 under QEMU again (≈ 50 min instead of a few)
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the container like on Unraid
        run: |
          node e2e/setup.mjs
          R="$PWD/e2e/.run"
          # PUID/PGID = owner of the files, exactly as on Unraid (no capabilities: root could not write either)
          docker run -d --name br --network host -e PORT=8095 -e PUID="$(id -u)" -e PGID="$(id -g)" -e UMASK=002 \
            -e MATCH_MODE=off -e METADATA_FALLBACK=false -e SETTLE_SECONDS=0 -e SCAN_INTERVAL=2 -e DUPLICATES=ask \
            -e AUTH_USER=admin -e AUTH_PASS=E2E-Admin-Kaffee-1 \
            --security-opt no-new-privileges:true --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            -v "$R/config:/config" -v "$R/inbox:/inbox" -v "$R/library:/audiobooks" hoerwerk:ci
          for i in $(seq 30); do curl -sf http://127.0.0.1:8095/api/health && break; sleep 1; done
          curl -s -o /dev/null -w "unangemeldet: %{http_code}\n" http://127.0.0.1:8095/api/system
      - name: Click-through tests against the container
        run: npx playwright test
        env:
          E2E_URL: http://127.0.0.1:8095
      - if: failure()
        run: docker logs br

  image:
    needs: [test, frontend, image-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # the image is called "hoerwerk"; the old name (repository name) keeps getting updates for a while
          images: |
            ghcr.io/${{ github.repository_owner }}/hoerwerk
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

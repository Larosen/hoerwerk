# Weekly update PRs; each one runs the full CI (tests, audits, image scan) before it can be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    groups:
      dev-tools: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}

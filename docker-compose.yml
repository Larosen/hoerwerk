services:
  hoerwerk:
    image: ghcr.io/larosen/hoerwerk:latest
    container_name: hoerwerk
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true       # nothing in the container can gain privileges
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID] # only to switch to PUID/PGID at start
    ports:
      - "8080:8080"
    volumes:
      - /path/to/audiobook-inbox:/inbox   # new audiobooks go here (also SABnzbd's category folder)
      - /path/to/audiobooks:/audiobooks   # the finished library (point Audiobookshelf/Plex here)
      - ./config:/config                  # database and settings
    environment:
      PUID: "1000"                   # owner of your files (`id` shows it); Unraid: 99
      PGID: "1000"                   # Unraid: 100
      UMASK: "002"                   # Unraid: 000
      APP_LANGUAGE: "en"             # en | de – UI and notifications (also under Settings)
      AUDIBLE_REGION: "us"           # us, uk, de, fr, it, es, ca, au, in, jp
      MATCH_MODE: "auto"             # auto | review | off
      INBOX_ORIGINALS: "archive"     # archive (to _fertig) | delete
      # TZ: "Europe/Berlin"          # local time in the log
      # CPU_CORES: "2"               # parallel ffmpeg processes (default: half the cores)
      # METADATA_FALLBACK: "true"    # Audnexus / Apple Books / Open Library when Audible has nothing
      # TRUSTED_PROXIES: "172.18.0.0/16"        # behind a reverse proxy: its network, so the real IP is logged
      # ALLOWED_HOSTS: "audiobooks.example.com" # extra host names; IPs, *.local and the public address always work
      # The admin account is created in the browser on first start; family accounts under Settings → Accounts.

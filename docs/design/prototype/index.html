<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hörwerk – Gestaltungsentwurf „Werkstatt &amp; Regal"</title>
<style>
/* ============================================================================================================
   Hörwerk – Gestaltungsentwurf „Werkstatt & Regal"
   Reines HTML/CSS/JS ohne Frameworks und ohne Webfonts: lässt sich 1:1 aus dem Rust-Server ausliefern.
   Aufruf: index.html?screen=discover|library|search|log|stats&theme=light|dark|oled
   ============================================================================================================ */

/* ---------- 1. Farbwelten (Design-Tokens) ---------------------------------------------------------------
   Hell  = „Papier"  : warmes Cremeweiß, Tinte statt Schwarz, Buchleinen-Grün, Messing als zweiter Akzent
   Dunkel= „Abend"   : warmes Espresso statt kaltem Grau – wie Leselampe, nicht wie Bildschirm
   OLED  = „Nacht"   : echtes Schwarz, Flächen nur durch Haarlinien, gedimmtes Creme statt Reinweiß          */
:root, :root[data-theme="light"] {
  --bg:#F3EDE0; --surface:#FBF8F0; --surface-2:#F0E9DA; --sunk:#E9E1CF;
  --line:#DCD2BC; --line-strong:#C6BA9E;
  --ink:#2B2520; --muted:#665B4B; --faint:#766A58;
  --accent:#1B6454; --accent-ink:#FFFFFF; --accent-soft:#DDEBE3; --accent-line:#A9CDBF;
  --brass:#8A5A0B; --brass-soft:#F3E4BF;
  --ok:#40642A; --ok-soft:#E3EBD3; --warn:#97520F; --warn-soft:#F7E6CC; --err:#A03B28; --err-soft:#F5DCD4;
  --plank-a:#D9CBA9; --plank-b:#C7B791; --plank-hi:rgba(255,255,255,.55);
  --cover-edge:rgba(40,25,10,.28); --cover-shadow:0 1px 1px rgba(60,40,10,.25), 0 8px 14px -8px rgba(60,40,10,.5);
  --card-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 1px 2px rgba(60,40,10,.06);
  --tint:9%; --scrim:rgba(43,37,32,.36);
  --s1:#1E6A5A; --s2:#B07A22; --s3:#9A453F; --s4:#3D5A80; --s5:#7A5C8E; --s6:#6B7A3A;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg:#1D1916; --surface:#27221F; --surface-2:#312B26; --sunk:#171310;
  --line:#3B342D; --line-strong:#52493F;
  --ink:#F1E9DB; --muted:#BBAE99; --faint:#9A8E7C;
  --accent:#63BDA6; --accent-ink:#0E1E19; --accent-soft:#223630; --accent-line:#2F5A4E;
  --brass:#E3AE55; --brass-soft:#3A2F1B;
  --ok:#9CC16F; --ok-soft:#2A3320; --warn:#E8A04A; --warn-soft:#3A2B17; --err:#E88468; --err-soft:#3C241D;
  --plank-a:#463C31; --plank-b:#3A3128; --plank-hi:rgba(255,235,200,.10);
  --cover-edge:rgba(255,240,215,.14); --cover-shadow:0 1px 1px rgba(0,0,0,.5), 0 10px 16px -8px rgba(0,0,0,.75);
  --card-shadow:0 1px 0 rgba(255,240,215,.04) inset;
  --tint:16%; --scrim:rgba(0,0,0,.6);
  --s1:#63BDA6; --s2:#E3AE55; --s3:#DB7A70; --s4:#7DA3D6; --s5:#B592C9; --s6:#A9BD6A;
  color-scheme: dark;
}
:root[data-theme="oled"] {
  --bg:#000000; --surface:#0B0A09; --surface-2:#151311; --sunk:#000000;
  --line:#2A2520; --line-strong:#3D352D;
  --ink:#EDE5D5; --muted:#A99D89; --faint:#8C806E;
  --accent:#6FCFB7; --accent-ink:#04120E; --accent-soft:#0C1F1A; --accent-line:#245347;
  --brass:#F0BC5E; --brass-soft:#241B0A;
  --ok:#A6CB78; --ok-soft:#111A09; --warn:#F0A94F; --warn-soft:#241705; --err:#EE8C70; --err-soft:#260F08;
  --plank-a:#1F1A15; --plank-b:#17130F; --plank-hi:rgba(255,235,200,.12);
  --cover-edge:rgba(255,240,215,.20); --cover-shadow:0 0 0 1px rgba(255,240,215,.06);
  --card-shadow:none;
  --tint:12%; --scrim:rgba(0,0,0,.75);
  --s1:#6FCFB7; --s2:#F0BC5E; --s3:#E5857A; --s4:#86AEE3; --s5:#C09DD4; --s6:#B4C972;
  color-scheme: dark;
}

/* ---------- 2. Grundlagen: Schrift, Maße, Bewegung -------------------------------------------------------
   Überschriften: Charter (auf iPhone, iPad und Mac vorinstalliert, wie ein Buchtitel gesetzt).
   Bedienelemente: Systemschrift (SF auf Apple) – keine Webfonts, nichts zu laden, scharf auf jeder Dichte.      */
:root {
  --serif: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", monospace;
  --r-s:8px; --r:12px; --r-l:18px; --touch:44px;
  --gut: clamp(16px, 4vw, 32px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin:0; }
html, body { overflow-x:clip; }
body { background:var(--bg); color:var(--ink); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; min-height:100dvh; }
h1,h2,h3,h4,p { margin:0; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
.serif { font-family:var(--serif); }
.eyebrow { font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); font-weight:600; }
.muted { color:var(--muted); } .faint { color:var(--faint); }
.num { font-variant-numeric: tabular-nums; white-space:nowrap; }
svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ---------- 3. Gerüst: iPhone = Tab-Leiste unten · iPad/Mac = Seitenleiste · breit = Detailspalte ---------- */
.app { min-height:100dvh; display:grid; grid-template-columns:minmax(0,1fr); }
.side { display:none; }
.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:5; display:grid; grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--bg) 94%, var(--surface)); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + var(--safe-b)); }
.tabbar button { display:flex; flex-direction:column; align-items:center; gap:2px; min-height:var(--touch); justify-content:center;
  font-size:10.5px; font-weight:600; color:var(--faint); position:relative; }
.tabbar button[aria-current="true"] { color:var(--accent); }
.tabbar button[aria-current="true"]::before { content:""; position:absolute; top:-7px; width:26px; height:3px; border-radius:0 0 3px 3px; background:var(--accent); }
.tabbar .badge { position:absolute; top:3px; left:calc(50% + 6px); min-width:16px; height:16px; padding:0 4px; border-radius:8px;
  background:var(--brass); color:var(--bg); font-size:10px; display:grid; place-items:center; font-weight:700; }
main { padding:0 var(--gut) calc(88px + var(--safe-b)); min-width:0; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 0 6px; }
.brand { display:flex; align-items:center; gap:10px; font-family:var(--serif); font-weight:700; font-size:19px; letter-spacing:.005em; }
.brand .mark { width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; }
.theme-seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--surface); }
.theme-seg button { height:30px; padding:0 11px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--muted); }
.theme-seg button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
.inspector { display:none; }

@media (min-width: 780px) {
  .app { grid-template-columns: 216px minmax(0,1fr); }
  .tabbar, .topbar { display:none; }
  main { padding-bottom:48px; }
  .side { display:flex; flex-direction:column; gap:22px; position:sticky; top:0; height:100dvh; padding:22px 14px 18px; border-right:1px solid var(--line);
    background:color-mix(in srgb, var(--bg) 70%, var(--surface-2)); }
  .side .brand { padding:0 8px; }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button { display:flex; align-items:center; gap:12px; height:40px; padding:0 10px; border-radius:var(--r-s); font-weight:550; color:var(--muted); text-align:left; position:relative; }
  .nav button:hover { background:var(--surface-2); color:var(--ink); }
  .nav button[aria-current="true"] { background:var(--surface); color:var(--ink); box-shadow:var(--card-shadow), 0 0 0 1px var(--line); }
  .nav button[aria-current="true"] svg { color:var(--accent); }
  .nav .sep { height:1px; background:var(--line); margin:8px 10px; }
  .nav .badge { margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--brass); color:var(--bg); font-size:11.5px; font-weight:700; display:grid; place-items:center; }
  .side .spacer { flex:1; }
  .side .theme-seg { align-self:stretch; } .side .theme-seg button { flex:1; padding:0; }
  .who { display:flex; align-items:center; gap:10px; padding:2px 8px; font-size:13.5px; font-weight:550; }
  .who i { width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-style:normal; font-weight:700; font-size:13px; border:1px solid var(--accent-line); }
}
@media (min-width: 1240px) {
  .app.has-inspector { grid-template-columns: 232px minmax(0,1fr) 352px; }
  .inspector { display:block; position:sticky; top:0; height:100dvh; overflow:auto; padding:26px 22px; border-left:1px solid var(--line);
    background:color-mix(in srgb, var(--bg) 70%, var(--surface-2)); }
}

/* ---------- 4. Seitenkopf, Chips, Knöpfe ------------------------------------------------------------------ */
.page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:10px 0 14px; }
@media (min-width:780px){ .page-head { padding-top:30px; } }
.page-head h1 { font-family:var(--serif); font-weight:700; font-size:clamp(30px, 4.2vw, 40px); line-height:1.08; letter-spacing:-.01em; }
.page-head .eyebrow { margin-bottom:6px; }
.chips { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 calc(var(--gut) * -1); padding:2px var(--gut) 4px; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; height:34px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:13.5px; font-weight:550; color:var(--muted); display:inline-flex; align-items:center; gap:7px; }
.chip[aria-pressed="true"], .chip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.chip .n { font-size:12px; opacity:.75; }
.btn { height:var(--touch); padding:0 20px; border-radius:var(--r-s); font-weight:650; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line-strong); background:var(--surface); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.sm { height:36px; padding:0 14px; font-size:13.5px; }
.btn.warn { background:var(--warn-soft); border-color:color-mix(in srgb, var(--warn) 45%, transparent); color:var(--warn); }
@media (min-width:780px){ .btn { height:38px; } .btn.sm { height:32px; } }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:var(--r-s); padding:2px; background:var(--surface); }
.seg button { height:32px; padding:0 14px; border-radius:6px; font-size:13.5px; font-weight:600; color:var(--muted); }
.seg button[aria-pressed="true"] { background:var(--surface-2); color:var(--ink); box-shadow:0 0 0 1px var(--line); }
.tag { display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:6px; font-size:11.5px; font-weight:650; letter-spacing:.02em; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
.tag.ok { background:var(--ok-soft); color:var(--ok); border-color:transparent; } .tag.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.tag.err { background:var(--err-soft); color:var(--err); border-color:transparent; } .tag.acc { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.tag.brass { background:var(--brass-soft); color:var(--brass); border-color:transparent; }

/* ---------- 5. Das Cover: gebundenes Buch statt aufgeklebtes Bild ----------------------------------------
   Immer quadratisch (Hörbuch-Format), immer gleicher Radius, feine Kante, Rückenlicht, Papierkorn, Kontaktschatten.
   Die Buchfarbe --c wird vom Cover abgeleitet und färbt auch die Fläche darum (Karte, Detail, Diagramm).        */
.cv { --c:#6B2D2D; position:relative; aspect-ratio:1; border-radius:5px; overflow:hidden; container-type:inline-size; color:#F7EEDB;
  background: linear-gradient(158deg, color-mix(in srgb, var(--c) 86%, #fff) 0%, var(--c) 52%, color-mix(in srgb, var(--c) 78%, #000) 100%);
  box-shadow: inset 0 0 0 1px var(--cover-edge), var(--cover-shadow); }
.cv::before { content:""; position:absolute; inset:0 auto 0 0; width:5.5%; background:linear-gradient(90deg, rgba(255,255,255,.28), rgba(255,255,255,0) 70%, rgba(0,0,0,.18)); }
.cv::after { content:""; position:absolute; inset:0; opacity:.5; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>"); }
.cv .au { position:absolute; left:11%; right:9%; top:9%; font:600 6.4cqw/1.2 var(--sans); letter-spacing:.14em; text-transform:uppercase; opacity:.8; }
.cv .ti { position:absolute; left:11%; right:9%; font-family:var(--serif); font-weight:700; line-height:1.08; text-wrap:balance; }
.cv .rule { display:none; }
.cv .ti::before { content:""; display:block; width:16cqw; height:1.4cqw; margin-bottom:4.5cqw; background:currentColor; opacity:.7; }
.cv.v1 .ti { bottom:11%; font-size:14.5cqw; }
.cv.v2 .ti { top:30%; font-size:13.5cqw; }
.cv.v3 { padding:0; } .cv.v3 .ti { top:50%; transform:translateY(-50%); text-align:center; font-size:12.5cqw; left:16%; right:14%; }
.cv.v3 .ti::before { display:none; }
.cv.v3 .au { text-align:center; left:14%; right:12%; } .cv.v3 .rule { display:none; }
.cv.v3 .frm { position:absolute; inset:6% 5% 6% 9%; border:.9cqw solid rgba(247,238,219,.55); border-radius:2px; }
.cv.v4 .big { position:absolute; right:-4%; bottom:-14%; font:700 78cqw/1 var(--serif); opacity:.16; }
.cv.v4 .ti { bottom:11%; font-size:13cqw; }
.cv.lg { border-radius:7px; }

/* ---------- 6. Regal: Cover stehen auf einem Brett, Beschriftung darunter wie ein Katalogschild -------------- */
.shelf-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:28px 0 10px; }
.shelf-head h2 { font-family:var(--serif); font-size:21px; font-weight:700; letter-spacing:-.005em; display:flex; align-items:baseline; gap:10px; }
.shelf-head h2::before { content:""; width:18px; height:3px; border-radius:2px; background:var(--brass); transform:translateY(-5px); flex:none; }
.shelf-head a, .shelf-head button.more { font-size:13.5px; font-weight:600; color:var(--accent); white-space:nowrap; flex:none; }
.shelf-head h2 { flex-wrap:wrap; min-width:0; row-gap:2px; }
@media (max-width:640px){ .shelf-head h2 .why { flex-basis:100%; margin-left:28px; } .shelf-head h2::before { transform:translateY(-5px); } }
.shelf-head .why { font-size:13px; color:var(--muted); font-weight:450; }
.shelf { display:flex; overflow-x:auto; scroll-snap-type:x proximity; scroll-padding:0 calc(var(--gut) - 8px); scrollbar-width:none; margin:0 calc(var(--gut) * -1); padding:0 calc(var(--gut) - 8px) 4px; }
.shelf::-webkit-scrollbar { display:none; }
.book { position:relative; flex:none; width:clamp(128px, 31vw, 172px); padding:0 8px; scroll-snap-align:start; text-align:left; display:block; }
.book .stand { padding-bottom:0; background:linear-gradient(var(--plank-a), var(--plank-b)) bottom / calc(100% + 16px) 7px no-repeat; margin:0 -8px; padding:0 8px 0; position:relative; }
.book .stand::after { content:""; position:absolute; left:0; right:0; bottom:6px; height:1px; background:var(--plank-hi); }
.book .stand .cv { margin-bottom:7px; }
.book .t { margin-top:12px; font-family:var(--serif); font-weight:700; font-size:14.5px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.book .a { font-size:12.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.book .meta { margin-top:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--faint); }
.book .new { position:absolute; top:7px; right:15px; z-index:2; }
.book[aria-selected="true"] .cv { outline:2px solid var(--accent); outline-offset:3px; }
@media (min-width:1100px){ .book { width:clamp(140px, 13.5vw, 176px); } }

/* ---------- 7. Karten, Werkbank, Tonspur -------------------------------------------------------------------- */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--card-shadow); }
.tinted { background: color-mix(in srgb, var(--surface), var(--c) var(--tint)); border-color: color-mix(in srgb, var(--line), var(--c) 28%); }

.feature { display:grid; grid-template-columns: clamp(132px, 34vw, 220px) minmax(0,1fr); gap:clamp(16px,3vw,28px); padding:clamp(16px,3vw,26px); align-items:center; }
.feature .why { font-size:13.5px; color:var(--muted); margin-top:12px; max-width:46ch; }
.feature h2 { font-family:var(--serif); font-weight:700; font-size:clamp(24px, 3.6vw, 34px); line-height:1.1; letter-spacing:-.01em; margin-top:6px; }
.feature .by { font-size:15px; color:var(--muted); margin-top:6px; }
.feature .facts { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; font-size:13.5px; color:var(--muted); }
.feature .facts b { color:var(--brass); font-weight:700; }
.feature .acts { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
@media (max-width:520px){ .feature { grid-template-columns:1fr; } .feature .cv { width:min(62%, 240px); margin:0 auto; } .feature .acts .btn { flex:1; } }

/* Tonspur: Fortschritt als Wellenform – das Erkennungszeichen von Hörwerk */
.wave { display:flex; align-items:center; justify-content:space-between; height:28px; }
.wave i { display:block; width:3px; border-radius:2px; background:var(--line-strong); opacity:.75; flex:none; }
.wave i.d { background:var(--accent); opacity:1; }
.wave.brass i.d { background:var(--brass); }
.wave.sm { height:20px; } .wave.sm i { width:2px; }

/* Werkbank: die vier Stationen eines Buchs */
.stations { display:grid; grid-template-columns:repeat(4,1fr); position:relative; margin-top:10px; }
.stations::before { content:""; position:absolute; left:12.5%; right:12.5%; top:6px; height:2px; background:var(--line); }
.stations i { position:absolute; left:12.5%; top:6px; height:2px; background:var(--accent); width:var(--fill); }
.st { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; letter-spacing:-.005em; font-weight:600; color:var(--faint); position:relative; z-index:1; text-align:center; }
.st b { width:14px; height:14px; border-radius:50%; background:var(--surface); border:2px solid var(--line-strong); display:block; }
.st.done { color:var(--muted); } .st.done b { background:var(--accent); border-color:var(--accent); }
.st.now { color:var(--ink); } .st.now b { border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 4px var(--accent-soft); }
.job { display:grid; grid-template-columns:64px minmax(0,1fr); gap:14px; padding:16px; }
.job + .job { border-top:1px solid var(--line); }
.job h3 { font-family:var(--serif); font-size:16.5px; line-height:1.25; }
.job .sub { font-size:13px; color:var(--muted); margin-top:2px; }
.job .line { display:flex; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--muted); margin-top:8px; }

.attention { display:flex; gap:14px; align-items:center; padding:14px 16px; background:var(--warn-soft); border:1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius:var(--r); }
.attention .ico { width:36px; height:36px; border-radius:50%; background:color-mix(in srgb, var(--warn) 22%, transparent); color:var(--warn); display:grid; place-items:center; flex:none; }
.attention p { font-size:13.5px; } .attention b { font-weight:650; }
.attention .btn { margin-left:auto; flex:none; }

/* Regal-Raster der Bibliothek */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(136px, 1fr)); gap:26px 0; margin:0 -8px; }
.grid .book { width:auto; }
@media (max-width:520px){ .grid { grid-template-columns:repeat(2, minmax(0,1fr)); } }

/* ---------- 8. Detailspalte (Inspektor) mit Inhaltsverzeichnis-Zeilen ---------------------------------------- */
.insp .cv { width:62%; margin:4px auto 0; }
.insp h2 { font-family:var(--serif); font-size:25px; line-height:1.12; margin-top:18px; letter-spacing:-.01em; }

.entry { display:grid; grid-template-columns:62px 112px minmax(0,1fr); gap:6px 14px; padding:13px 0 13px 14px; border-bottom:1px solid var(--line); position:relative; align-items:baseline; }
.entry::before { content:""; position:absolute; left:0; top:13px; bottom:13px; width:3px; border-radius:2px; background:var(--lvl, var(--line-strong)); }

.panel { padding:18px 18px 16px; } .panel h3 { font-family:var(--serif); font-size:18px; } .panel .sub { font-size:13px; color:var(--muted); margin-top:2px; }

.hbar + .hbar { border-top:1px solid var(--line); } .hbar .cv { width:34px; border-radius:3px; } .hbar .nm { font-size:14px; font-weight:600; } .hbar .track { height:8px; border-radius:4px; background:var(--sunk); margin-top:6px; overflow:hidden; } .hbar .track b { display:block; height:100%; border-radius:4px; background:var(--c); }
.hbar .val { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.ribbon { display:flex; height:16px; border-radius:8px; overflow:hidden; gap:2px; margin-top:16px; } .ribbon b { display:block; height:100%; }
.hidden { display:none !important; }

  const W=520,H=270,pl=26,pb=26,bw=44,gap=(W-pl-bw*7)/6, max=4; const bars=days.map(([d,v],i)=>{const h=(H-pb-8)*v/max, x=pl+i*(bw+gap), y=H-pb-h; const cur=d==='Sa'; return `<path d="M${x} ${H-pb}V${y+8}a8 8 0 0 1 8-8h${bw-16}a8 8 0 0 1 8 8V${H-pb}z" fill="${cur?'var(--brass)':'var(--s1)'}" opacity="${cur?1:.82}"/><text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${d}</text>${cur?`<text x="${x+bw/2}" y="${y-8}" text-anchor="middle" style="fill:var(--brass);font-weight:700">${v} Std.</text>`:''}`;}).join('');
  const lines=[0,1,2,3,4].map(g=>`<line class="grid-l" x1="${pl}" x2="${W}" y1="${H-pb-(H-pb-8)*g/max}" y2="${H-pb-(H-pb-8)*g/max}"/>`).join('');
  const mon=[18,22,16,25,30,28,34,31,38,42,36,48], MW=520,MH=150; const pts=mon.map((v,i)=>[10+i*(MW-20)/11, MH-14-(MH-34)*v/52]);
  const dpath=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const au=[['Arthur Conan Doyle','hound',84,'9 Bücher · 46 Std.'],['H. G. Wells','wotw',58,'4 Bücher · 18 Std.'],['Jane Austen','emma',46,'3 Bücher · 41 Std.'],['Robert Louis Stevenson','island',31,'2 Bücher · 10 Std.']];
  return `
  <header class="page-head"><div><p class="eyebrow">Dein Hörjahr</p><h1>Statistik</h1></div><div class="seg"><button aria-pressed="false">Woche</button><button aria-pressed="true">Monat</button><button aria-pressed="false">Jahr</button></div></header>
  <div class="facts4">
   <div class="card fact"><p class="eyebrow">Gehört</p><div class="v">18<small>Std.</small> 40<small>Min.</small></div><p class="d">▲ 22 % zum Vormonat</p></div>

  </div>

     <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hörzeit pro Wochentag">${lines}${bars}</svg></section>
   <section class="card panel"><h3>Genres</h3><p class="sub">Womit du die Zeit verbringst</p>
     <div class="ribbon"><b style="flex:38;background:var(--s1)"></b><b style="flex:24;background:var(--s2)"></b><b style="flex:18;background:var(--s3)"></b><b style="flex:12;background:var(--s4)"></b><b style="flex:8;background:var(--s5)"></b></div>

     <div style="margin-top:18px"><h3 style="font-size:16px">Monate</h3><p class="sub">Hörstunden seit Dezember</p>
     <svg class="chart" viewBox="0 0 ${MW} ${MH}" role="img" aria-label="Hörstunden pro Monat"><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--s1)" stop-opacity=".34"/><stop offset="1" stop-color="var(--s1)" stop-opacity="0"/></linearGradient></defs>
       <path d="${dpath} L${pts[11][0]} ${MH-14} L${pts[0][0]} ${MH-14}z" fill="url(#ag)"/><path d="${dpath}" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[11][0]}" cy="${pts[11][1]}" r="5" fill="var(--brass)" stroke="var(--surface)" stroke-width="2.5"/></svg></div></section>

};

/* ---------- Gerüst aufbauen ---------------------------------------------------------------------------------------- */
const NAV = [['discover','Entdecken','discover'],['search','Suche','search'],['requests','Anfragen','requests',2],['library','Bücher','books']];
const MORE = [['log','Protokoll','log'],['stats','Statistik','stats'],['settings','Einstellungen','gear']];
const q = new URLSearchParams(location.search);
const screenKey = SCREENS[q.get('screen')] ? q.get('screen') : 'discover';
let theme = ['light','dark','oled'].includes(q.get('theme')) ? q.get('theme') : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
if (q.get('safe')) document.documentElement.style.setProperty('--safe-b', q.get('safe') + 'px');
const brand = `<div class="brand"><span class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M6 8v8M10 5v14M14 8.5v7M18 10.5v3"/></svg></span>Hörwerk</div>`;
const themeSeg = `<div class="theme-seg" role="group" aria-label="Darstellung">${[['light','Hell'],['dark','Dunkel'],['oled','OLED']].map(([k,l])=>`<button data-theme-btn="${k}" aria-pressed="${k===theme}">${l}</button>`).join('')}</div>`;
function render(){
  document.documentElement.dataset.theme = theme;
  const s = SCREENS[screenKey];
  document.title = 'Hörwerk – ' + s.title;
  const item = ([k,l,i,n]) => `<button aria-current="${k===screenKey}">${ic(i)}<span>${l}</span>${n?`<span class="badge">${n}</span>`:''}</button>`;
  document.getElementById('side').innerHTML = brand + `<nav class="nav" aria-label="Hauptmenü">${NAV.map(item).join('')}<div class="sep"></div>${MORE.map(item).join('')}</nav><div class="spacer"></div>
    <div class="card" style="padding:12px 14px"><p class="eyebrow" style="margin-bottom:8px">Werkbank</p><p style="font-size:13px;font-weight:600">2 Bücher in Arbeit</p><div style="margin-top:8px">${wave(5,48,'sm')}</div></div>${themeSeg}<div class="who"><i>A</i>admin</div>`;
  document.getElementById('topbar').innerHTML = brand + themeSeg;
  document.getElementById('tabbar').innerHTML = [...NAV, ['more','Mehr','more']].map(([k,l,i,n]) => `<button aria-current="${k===screenKey || (k==='more' && ['log','stats'].includes(screenKey))}">${ic(i)}<span>${l}</span>${n?`<span class="badge">${n}</span>`:''}</button>`).join('');
  document.getElementById('main').innerHTML = s.html();
  const insp = document.getElementById('insp');
  insp.innerHTML = s.inspector ? s.insp() : '';
  document.getElementById('app').classList.toggle('has-inspector', !!s.inspector);
  fillWaves();
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => { theme = b.dataset.themeBtn; render(); }));
}
render();
</script>
